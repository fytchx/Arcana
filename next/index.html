<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1019">
<meta name="robots" content="noindex,nofollow">
<title>Arcana</title>
<link rel="icon" href="/assets/arcana-logo.webp" type="image/webp">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/next/app.css">
<style>
/* Loading screen: painted before anything else, in the last design this device saw. */
#nxSplash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg,#1B1C24);transition:opacity .35s ease,visibility .35s}
#nxSplash.done{opacity:0;visibility:hidden}
#nxSplash .sp{display:flex;flex-direction:column;align-items:center;gap:18px}
#nxSplash .mark{display:flex;align-items:center;gap:14px}
#nxSplash img{width:52px;height:auto;filter:var(--logo-filter,none);animation:spPulse 1.6s ease-in-out infinite}
#nxSplash b{font:800 20px/1 Inter,system-ui,sans-serif;letter-spacing:.2em;margin-right:-.2em;background:linear-gradient(180deg,#fff 0%,#E4E6EE 38%,#9EA3B5 52%,#D9DCE6 64%,#F7F8FB 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#nxSplash i{display:block;width:120px;height:3px;border-radius:3px;background:color-mix(in srgb,var(--accent,#8B5CF6) 20%,transparent);overflow:hidden}
#nxSplash i::after{content:'';display:block;width:40%;height:100%;border-radius:3px;background:var(--accent,#8B5CF6);animation:spBar 1.1s ease-in-out infinite}
@keyframes spBar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes spPulse{50%{opacity:.75;transform:scale(.97)}}
@media (prefers-reduced-motion:reduce){#nxSplash img,#nxSplash i::after{animation:none}}
</style>
<script>
// Old classic links (arcanacompanion.xyz/#/...) land here now. Send each to its new page,
// or to the classic site at /classic when there is no new equivalent yet.
(function(){try{
 var h=location.hash||'',m=h.match(/^#\/([^?]*)(?:\?(.*))?$/);if(!m)return;
 var path=m[1].replace(/\/$/,''),q=new URLSearchParams(m[2]||''),first=path.split('/')[0];
 var NEXT=['home','tools','codex','builds','news','profile','studio','build','admin','feedback','checklist','guilds','lfg','records','directory','handbook','guides'];
 if(path==='account'){var k='arcana-next-return',v=sessionStorage.getItem(k);sessionStorage.removeItem(k);
  if(!q.get('error')&&v&&/^\/next(?:#\/[\w\-\/?=&%.:]*)?$/.test(v)){location.replace(v.replace(/^\/next/,'/'));return;}
  history.replaceState(null,'','/#/profile');return;}
 var MAP={'calculators/pathfinder':'tools/pathfinder','calculators':'tools','labs/build':'studio','labs/guild-tree':'tools/guild-tree','labs/skills':'studio/class','labs/passives':'studio/passive','labs':'tools','journal':'news','community':'builds/community','lfg/raids':'lfg','lfg/guilds':'guilds','recent':'home','beta':'feedback'};
 if(path==='journal/article'&&q.get('slug')){history.replaceState(null,'','/#/news/'+encodeURIComponent(q.get('slug')));return;}
 // The old Season 2 retaliation guide was replaced by the featured guide.
 if(path==='wiki/article'&&q.get('id')==='retaliation-warrior-zane'){history.replaceState(null,'','/#/guides/retaliation-warrior');return;}
 if(path==='community/post'&&q.get('id')){history.replaceState(null,'','/#/builds/'+encodeURIComponent(q.get('id')));return;}
 var shared=q.has('share')||q.has('id')||q.has('l');
 if(MAP[path]&&!shared){history.replaceState(null,'','/#/'+MAP[path]);return;}
 if(NEXT.indexOf(first)>-1&&!/^guilds\/(register|manage)/.test(path)&&!(first==='lfg'&&path!=='lfg'))return;
 location.replace('/classic'+h);
}catch(e){}})();
// Apply the design this device saw last, before the first paint, so nothing changes in front of the player.
try{var v=JSON.parse(localStorage.getItem('arcana-next-vars-v1')||'{}');for(var k in v)if(/^--[a-z0-9-]+$/.test(k))document.documentElement.style.setProperty(k,String(v[k]).slice(0,200))}catch(e){}
</script>
</head>
<body>
<div id="nxSplash" role="status" aria-label="Loading Arcana"><div class="sp"><div class="mark"><img src="/assets/arcana-logo.webp" alt=""><b>ARCANA</b></div><i></i></div></div>
<a class="nx-skip" href="#nxMain">Skip to content</a>
<header class="nx-top">
  <div id="nxTopL" class="nx-top-l"><span class="nx-word">ARCANA</span></div>
  <nav id="nxNav" class="nx-nav" aria-label="Main"></nav>
  <div id="nxTopR" class="nx-top-r"></div>
</header>
<div id="nxNotice" class="nx-notice" role="status" hidden></div>
<main id="nxMain" class="nx-main" tabindex="-1">
  <noscript><p>Arcana needs JavaScript. The <a href="/">classic site</a> works without this preview.</p></noscript>
</main>
<script type="module" src="/next/app.js"></script>
</body>
</html>
