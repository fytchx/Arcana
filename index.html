/* The HTML must remain usable even if an Android embedded browser fails to
   initialize the JavaScript module graph. Show a retry, never a blank page. */
(function(){
 var done=false;
 function display(){
  if(done)return;
  var box=document.getElementById('content');
  if(!box||box.children.length||box.textContent.trim())return;

  var hint=document.createElement('small');hint.textContent='If this keeps happening in an in-app browser, open the same link in Chrome or your regular browser.';

  box.appendChild(wrap);
 }
 window.addEventListener('error',function(event){
  var target=event.target;

 },true);

})();
