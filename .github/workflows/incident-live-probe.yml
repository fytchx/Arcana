name: Arcana Live Incident Diagnosis
on:
  push:
    branches: [diagnostic/live-connectivity-loader-2026-10-19]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve and curl both domain variants
        run: |
          for host in arcanacompanion.xyz www.arcanacompanion.xyz; do
            echo "=== DNS $host ==="
            getent ahosts "$host" || true
            echo "=== HEAD $host ==="
            curl -sS -L -I --connect-timeout 8 --max-time 16 "https://$host" || true
          done
      - run: python -m pip install 'playwright>=1.55,<2'
      - run: python -m playwright install --with-deps chromium
      - run: python tests/incident_live_probe.py
