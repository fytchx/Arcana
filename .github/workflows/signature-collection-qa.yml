name: Signature Collection QA
on:
  push:
    branches: [feature/arcana-signature-collection-2026-10-18, feature/psychedelic-patterns-real-theme-preview-2026-10-19, feature/guild-tags-only-theme-qa-2026-10-19, fix/boot-loader-guild-tags-responsive-home-2026-10-19, release-candidate/guild-tags-psychedelic-2026-10-19, feature/arcana-connected-ux-audit-2026-10-19, fix/pathfinder-oct17-materials-2026-10-19]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright>=1.55,<2'
      - run: python -m playwright install --with-deps chromium
      - run: python tests/mobile_smoke.py
      - run: python tests/public_theme_performance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signature-mobile-regression
          path: qa-output/*.png
          if-no-files-found: ignore
