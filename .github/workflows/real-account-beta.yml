name: Arcana Real Account Beta Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify live Discord enrollment, privacy and authenticated API boundaries
        run: python tests/real_account_live_gate.py
