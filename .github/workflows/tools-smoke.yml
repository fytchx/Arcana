name: Arcana Tools and Labs Smoke
on:
  push:
    branches: [stabilization-recovery-2026-10-12]
    paths:
      - .github/workflows/tools-smoke.yml
      - tests/tools_staging_smoke.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization-recovery-2026-10-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright>=1.55,<2'
      - run: python -m playwright install --with-deps chromium
      - name: Verify ten deployed calculators, planners and LFG routes
        run: python tests/tools_staging_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana-tools-regression-report
          path: qa-output/arcana-*
          if-no-files-found: ignore
