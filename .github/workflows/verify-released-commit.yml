name: Arcana Verify Released Commit
on:
  workflow_dispatch:
    inputs:
      target:
        description: Website to verify
        type: choice
        required: true
        options:
          - production
          - preview
      expected_sha:
        description: Full 40-character Git SHA deployed to the target
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ARCANA_RELEASE_TARGET: ${{ inputs.target }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm the correct commit is live and public routes are healthy
        run: node scripts/verify-release.mjs
