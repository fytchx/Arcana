name: Arcana Artwork Inventory
on:
  push:
    branches: [stabilization-recovery-2026-10-12]
    paths:
      - .github/workflows/art-inventory.yml
  workflow_dispatch:
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/inventory-missing-art.mjs
