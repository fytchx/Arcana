name: Arcana staging smoke
on:
  workflow_dispatch:
  push:
    branches: [stabilization-recovery-2026-10-12]
    paths:
      - .github/workflows/staging-smoke.yml
      - tests/live_staging_smoke.py
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization-recovery-2026-10-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright>=1.55,<2'
      - run: python -m playwright install --with-deps chromium
      - name: Verify deployed website, art, catalog, and mobile navigation
        run: python tests/live_staging_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana-staging-browser-screenshot
          path: qa-output/arcana-staging-*.png
          if-no-files-found: ignore
