name: Arcana Preview Release Checks
on:
  push:
    branches: [feature/build-studio-preview-2026-10-22]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arcana-preview-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARCANA_STAGING_URL: https://arcana-preview-app-preview.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright>=1.55,<2'
      - run: python -m playwright install --with-deps chromium
      - name: Verify exact preview commit, mobile navigation and Journal appearance
        run: python tests/preview_live_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana-preview-evidence
          path: qa-output/*
          if-no-files-found: ignore
